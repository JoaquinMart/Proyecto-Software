[project]
name = "web"
version = "0.1.0"
description = ""
authors = [
    {name = "Santiago Fernández",email = "santifernandezok1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "sqlalchemy (>=2.0,<2.1)",
    "flask-sqlalchemy (>=3.1,<3.2)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "flask-session (>=0.8.0,<0.9.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)"
]

[tool.poetry]
packages = [{include = "web", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.1.1,<10.0.0)"
]
