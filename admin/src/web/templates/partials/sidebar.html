{% set iconos = {
  "users":    '<path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="7" r="3.5"/><path d="M21 19v-1a4 4 0 0 0-3-3.87M15.5 3.63a3.5 3.5 0 0 1 0 6.74"/>',
  "building": '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M8 7h2M14 7h2M8 11h2M14 11h2"/>',
  "id":       '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.2 1.7-2 3-2s2.4.8 3 2M14 10h4M14 13h3"/>',
  "tag":      '<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  "plate":    '<circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 4v5M5 4v5M4 9v12M20 4c-1.5 0-2 2-2 4s1 3 2 3v10"/>',
  "sliders":  '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'
} %}

<aside class="sidebar" id="sidebar" aria-label="Navegación principal">
  <a class="brand" href="{{ url_for('home') }}">
    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13"/><path d="M10 17h12a6 6 0 0 1-12 0z"/><path d="M13 12c0-2 2-2 2-4M17 12c0-2 2-2 2-4"/>
    </svg>
    <span class="brand__text">
      <strong>Alimentación</strong>
      <small>Hospital Sor María Ludovica</small>
    </span>
  </a>

  <nav>
    <ul class="nav">
      {% for item in menu_items %}
        {% set activo = blueprint_activo == item.blueprint %}
        <li>
          <a href="{{ url_for(item.endpoint) }}"
             class="nav__link{% if activo %} is-active{% endif %}"
             {% if activo %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">{{ iconos[item.icon] | safe }}</svg>
            {{ item.label }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</aside>
<div class="sidebar-backdrop" data-close-sidebar></div>
